<div class="geek-cursor" id="geekCursor" aria-hidden="true">PTR_X:0000&nbsp;&nbsp;PTR_Y:0000</div>

<script>
  (function () {
    const themeButton = document.getElementById("geekThemeButton");
    const cursorReadout = document.getElementById("geekCursor");

    if (themeButton) {
      themeButton.addEventListener("click", function () {
        const active = document.body.classList.toggle("is-alt-palette");
        themeButton.setAttribute("aria-pressed", String(active));
        themeButton.textContent = active ? "reroll_again()" : "reroll_palette()";
      });
    }

    if (cursorReadout) {
      window.addEventListener("pointermove", function (event) {
        cursorReadout.textContent =
          "PTR_X:" + String(event.clientX).padStart(4, "0") +
          "  PTR_Y:" + String(event.clientY).padStart(4, "0");
      }, { passive: true });
    }
  })();
</script>
